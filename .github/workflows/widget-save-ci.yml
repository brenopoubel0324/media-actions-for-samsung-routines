name: Widget save regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation:
        description: Escopo (completo antes de entregar)
        type: choice
        options: [full, daily]
        default: full
      upload_candidates:
        description: Guardar candidatos de CI (não são APKs oficiais)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select validation from the complete interval
        id: plan
        run: python3 scripts/ci/plan.py --fetch --output "$RUNNER_TEMP/ci-plan.json"
      - name: Check CI selection contracts
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Verify patch formatting
        run: python3 scripts/ci/run.py format --plan "$RUNNER_TEMP/ci-plan.json"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.plan.outputs.mode != 'docs'
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android SDK 36 is available
        if: steps.plan.outputs.mode != 'docs'
        run: |
          if test -f "$ANDROID_HOME/platforms/android-36/android.jar" && test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"; then
            exit 0
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"android-licenses.txt").write_text("y\n"*100)'
          "$SDKMANAGER" --licenses < "$RUNNER_TEMP/android-licenses.txt" > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        if: steps.plan.outputs.mode != 'docs'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      - name: Run selected Android validation
        if: steps.plan.outputs.mode != 'docs'
        run: python3 scripts/ci/run.py validate --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Inspect Release, Preview and Wear candidates
        if: steps.plan.outputs.mode == 'full'
        run: python3 scripts/ci/run.py inspect --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Keep explicitly requested candidates
        if: steps.plan.outputs.mode == 'full' && github.event_name == 'workflow_dispatch' && inputs.upload_candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/preview/*.apk
            wear/build/outputs/apk/debug/*.apk
      - name: Keep reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-save-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results*
            app/build/outputs/widget-previews/
            wear/build/reports/tests/
            wear/build/test-results/
            wear/build/reports/lint-results*
            shared/build/reports/tests/
            shared/build/test-results/
            shared/build/reports/lint-results*
      - name: Record selection and outcome
        if: always() && steps.plan.outputs.mode != ''
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci/run.py summary --plan "$RUNNER_TEMP/ci-plan.json"
