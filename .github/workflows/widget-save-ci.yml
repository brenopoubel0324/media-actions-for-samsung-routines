name: Widget save regression checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36 using runner SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify patch formatting
        run: git diff --check origin/main...HEAD
      - name: Android build, Robolectric tests, lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assemblePreview :wear:assembleDebug testDebugUnitTest lintDebug --console=plain --no-daemon
      - name: Verify preview cannot overwrite installed app
        run: |
          APK="$(find app/build/outputs/apk/preview -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='dev.local.mediaactions.preview'"
      - name: Upload isolated S25 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: media-actions-s25-isolated-preview
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
      - name: Keep test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-save-test-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
            wear/build/reports/tests/
            shared/build/reports/tests/
